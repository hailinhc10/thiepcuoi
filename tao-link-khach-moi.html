<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tạo link khách mời</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:20px} label{display:block;font-weight:600;margin:16px 0 6px}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}
textarea{min-height:160px} button{padding:9px 14px;border:0;border-radius:8px;background:#7b1e2b;color:#fff;font:inherit;cursor:pointer;margin:12px 8px 0 0}
button.s{background:#555} table{width:100%;border-collapse:collapse;margin-top:16px}
td{border-bottom:1px solid #ddd;padding:8px 4px;vertical-align:top;font-size:14px;word-break:break-all}
td.n{white-space:nowrap;font-weight:600;padding-right:10px}
</style></head><body>
<h1>Tạo link thiệp mời theo từng khách</h1>
<label>Link thiệp (dán link website của bạn, ví dụ https://ten-mien.com/)</label>
<input id="base" placeholder="https://...">
<label>Danh sách khách mời (mỗi dòng một tên, ví dụ: Anh Nam, Chị Hoa, Gia đình bác Tuấn)</label>
<textarea id="names"></textarea>
<button onclick="gen()">Tạo link</button>
<button class="s" onclick="copyAll()">Sao chép tất cả</button>
<button class="s" onclick="dl()">Tải file CSV</button>
<table id="out"></table>
<script>
var rows=[];
function gen(){
  var b=document.getElementById('base').value.trim().replace(/[?#].*$/,'');
  var ns=document.getElementById('names').value.split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean);
  rows=ns.map(function(n){return [n,b+'?guest='+encodeURIComponent(n)]});
  var t=document.getElementById('out');t.innerHTML='';
  rows.forEach(function(r){
    var tr=t.insertRow();
    tr.insertCell().textContent=r[0];tr.cells[0].className='n';
    tr.insertCell().textContent=r[1];
    var c=tr.insertCell();var bt=document.createElement('button');bt.textContent='Chép';
    bt.onclick=function(){navigator.clipboard.writeText(r[1]);bt.textContent='Đã chép'};
    c.appendChild(bt);
  });
}
function copyAll(){navigator.clipboard.writeText(rows.map(function(r){return r[0]+'\t'+r[1]}).join('\n'))}
function dl(){
  var csv='\ufeffTên khách,Link\n'+rows.map(function(r){return '"'+r[0].replace(/"/g,'""')+'","'+r[1]+'"'}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='link-khach-moi.csv';a.click();
}
</script></body></html>
